# What kitty does when you click a file:// hyperlink (e.g. paths printed by
# claude code). Without this it falls through to macOS `open`, which routes by
# UTI: .ts is also an MPEG transport stream, so IINA wins it.
#
# Policy: nvim is the default for everything; only known media/binary types are
# handed to macOS. First matching rule wins, so the exclusions come first.

# media, archives, binaries, office docs -> macOS default app
protocol file
ext png,jpg,jpeg,gif,webp,avif,heic,heif,tiff,tif,bmp,ico,icns,psd,ai,eps,sketch,fig,pdf,mp4,mkv,mov,avi,webm,m4v,mpg,mpeg,wmv,flv,3gp,mp3,m4a,wav,flac,aac,ogg,oga,opus,aiff,mid,midi,zip,tar,gz,tgz,bz2,xz,zst,7z,rar,jar,dmg,pkg,iso,app,exe,dll,so,dylib,o,a,class,wasm,pyc,pyo,db,sqlite,sqlite3,mdb,woff,woff2,ttf,otf,eot,doc,docx,xls,xlsx,ppt,pptx,key,numbers,pages,epub,mobi,bin,dat,pcap,pcapng
action launch --type=background -- open ${FILE_PATH}

# directories -> shell there, not Finder
protocol file
mime inode/directory
action launch --type=os-window --cwd=${FILE_PATH}

# everything else with a line-number fragment (file:///x.ts#42) -> nvim at that line
protocol file
fragment_matches ^[0-9]+
action launch --type=overlay --cwd=current -- nvim +${FRAGMENT} ${FILE_PATH}

# everything else -> nvim
protocol file
action launch --type=overlay --cwd=current -- nvim ${FILE_PATH}
